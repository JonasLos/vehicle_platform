velodyne_driver_node:
    ros__parameters:
        device_ip: 192.168.130.1
        gps_time: false
        time_offset: 0.0
        enabled: true
        read_once: false
        read_fast: false
        repeat_delay: 0.0
        frame_id: velodyne
        model: VLP16
        rpm: 600.0
        # Split scans on azimuth (straight behind) so each cloud is exactly one revolution,
        # matching lidar_tc.
        cut_angle: 3.14159
        port: 2370
        timestamp_first_packet: false
